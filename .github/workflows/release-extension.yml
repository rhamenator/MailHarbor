name: Release browser extension

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ml
      - run: npm ci
      - run: cargo test --manifest-path ml/Cargo.toml --locked
      - run: npm test
      - run: npm run verify:no-credentials
      - run: cargo install wasm-pack --locked --version 0.15.0
      - run: npm run build:wasm
      - name: Verify extension manifest and bundle
        run: |
          node -e "const m=require('./extension/manifest.json'); if(m.manifest_version!==3) process.exit(1)"
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then version="0.1.${GITHUB_RUN_NUMBER}"; fi
          mkdir -p dist
          (cd extension && zip -qr "../dist/MailHarbor-${version}-manifest-v3.zip" .)
          sha256sum dist/*.zip > "dist/MailHarbor-${version}.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: mail-harbor-extension
          path: dist/*
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
